[project]
name = "orders-analytics"
version = "0.1.0"
description = "Project scaffold for an order-analytics technical challenge focused on data cleaning, SQL views, and natural-language querying."
readme = "README.md"
authors = [
    { name = "Marcos A. Del Río Rodríguez" }
]
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.163.1",
    "httpx>=0.28.1",
    "openai>=3.51.0",
    "pandas>=3.1.1",
    "pydantic-settings>=2.16.3",
    "sqlglot>=30.31.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
orders-analytics = "orders_analytics:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]
extend-exclude = ["data", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
